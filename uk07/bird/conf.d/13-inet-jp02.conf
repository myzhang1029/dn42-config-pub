protocol bgp jp02 from full_ibgp {
    neighbor fdc0:d227:306:aa02::1 as inet_asn;
    # ca04 to jp02: only send dn42 full table but accept all inet routes
    ipv4 {
        import filter full_ibgp_import_v4;
        export filter dn42_ibgp_export_v4;
    };
    ipv6 {
        import filter full_ibgp_import_v6;
        export filter dn42_ibgp_export_v6;
    };
}
