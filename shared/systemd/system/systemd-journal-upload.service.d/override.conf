[Service]
LoadCredential=fullchain.pem:/etc/acmesh/systemd-log-fullchain.pem
LoadCredential=privkey.pem:/etc/acmesh/systemd-log-privkey.pem
LoadCredential=ca.pem:/etc/acmesh/systemd-log-ca.pem
ExecStart=
ExecStart=/usr/lib/systemd/systemd-journal-upload --save-state=/run/systemd/journal-upload/state --key=${CREDENTIALS_DIRECTORY}/privkey.pem --cert=${CREDENTIALS_DIRECTORY}/fullchain.pem --trust=${CREDENTIALS_DIRECTORY}/ca.pem --url=https://[fdc0:d227:306:ca04::1]:19532
RuntimeDirectory=systemd/journal-upload
Restart=always
RestartSteps=5
RestartMaxDelaySec=60
StartLimitIntervalSec=0
