# OSPF as IGP

filter igp_export {
    # Don't hijack everyone else
    if (source = RTS_BGP) then reject;
    # Don't leak things local to this host
    if (net ~ igp_no_redis_netset4) then reject;
    if (net ~ igp_no_redis_netset6) then reject;
    accept;
}

protocol ospf int_ospf4 {
    ipv4 {
        import all;
        export filter igp_export;
    };
    include "/etc/bird/conf.d/11-igp-ospf.subconf";
}

protocol ospf v3 int_ospf6 {
    ipv6 {
        import all;
        export filter igp_export;
    };
    include "/etc/bird/conf.d/11-igp-ospf.subconf";
}
