# /etc/bird/conf.d/12-igp-ospf.conf

protocol ospf int_ospf4 {
    ipv4 {
        import all;
        export filter igp_export;
    };
    area 0 {
        interface "gre-????" {
            type ptp;
            ptp netmask on;
            hello 15;
            dead 40;
            cost 30;
        };
        interface "wginternal?" {
            type ptp;
            ptp netmask on;
            hello 15;
            dead 40;
            cost 60;
        };
    };
}

protocol ospf v3 int_ospf6 {
    ipv6 {
        import all;
        export filter igp_export;
    };
    area 0 {
        interface "gre-????" {
            type ptp;
            hello 15;
            dead 40;
            cost 30;
        };
        interface "wginternal?" {
            type ptp;
            hello 15;
            dead 40;
            cost 60;
        };
    };
}
